<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dirtyshopp27</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg:#080414; --surface:#140c28; --surface2:#1e1236; --line:#3d2070;
    --text:#f4efec; --muted:#a98d86;
    --fire:#ff3b1f; --ember:#ff8a1f;
    --ok:#3fcf6e; --warn:#ffb020; --off:#6d625f;
    --display:"Rubik Wet Paint","Impact","Arial Black",sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body {
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
      radial-gradient(70% 38% at 12% 0%, rgba(140,60,255,.42), transparent 70%),
      radial-gradient(60% 34% at 100% 22%, rgba(255,60,200,.24), transparent 70%),
      radial-gradient(80% 40% at 0% 62%, rgba(40,130,255,.22), transparent 70%),
      radial-gradient(90% 50% at 100% 100%, rgba(150,70,255,.36), transparent 70%),
      linear-gradient(180deg,#0f0820 0%,#080414 45%,#0d0620 100%);
    background-attachment:fixed; padding:0 12px 120px; overflow-x:hidden;
  }
  #embers { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }

  /* фоновая сцена: зомби и вейпы */
  .scene { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .zw { position:absolute; left:0; bottom:var(--b); height:var(--h); width:var(--w); opacity:var(--o);
        animation:patrol var(--t) linear infinite; animation-delay:var(--d); }
  .zf { width:100%; height:100%; animation:turn var(--t) linear infinite; animation-delay:var(--d); }
  .zf svg { width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 8px rgba(255,59,31,.45)); }
  @keyframes patrol { 0%,100% { transform:translateX(0); } 50% { transform:translateX(calc(100vw - var(--w))); } }
  @keyframes turn { 0%,49.99% { transform:scaleX(1); } 50%,99.99% { transform:scaleX(-1); } }
  .zb { animation:bob .36s ease-in-out infinite alternate; }
  .leg, .arm { transform-box:fill-box; }
  .leg { transform-origin:50% 0; animation:swing .72s ease-in-out infinite alternate; }
  .leg.b { animation-direction:alternate-reverse; }
  .arm { transform-origin:0 50%; animation:reach .9s ease-in-out infinite alternate; }
  @keyframes swing { from { transform:rotate(-26deg); } to { transform:rotate(26deg); } }
  @keyframes reach { from { transform:rotate(-7deg); } to { transform:rotate(9deg); } }
  @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-2.5px); } }

  .vp { position:absolute; width:40px; height:100px; opacity:.9; transform:rotate(var(--r));
        animation:floaty var(--ft) ease-in-out infinite alternate; animation-delay:var(--fd); }
  .vp svg { width:100%; height:100%; display:block; filter:drop-shadow(0 0 10px var(--c)); }
  .led { animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  @keyframes floaty { from { transform:translateY(-12px) rotate(calc(var(--r) - 5deg)); } to { transform:translateY(14px) rotate(calc(var(--r) + 5deg)); } }
  .puff { position:absolute; left:50%; top:-2px; width:26px; height:26px; border-radius:50%; opacity:0;
          background:radial-gradient(circle, var(--c) 0%, rgba(255,255,255,.25) 40%, transparent 70%);
          animation:rise 4.2s ease-out infinite; }
  .puff:nth-child(2) { animation-delay:1.4s; --dx:-16px; }
  .puff:nth-child(3) { animation-delay:2.8s; --dx:22px; }
  @keyframes rise { 0% { transform:translate(-50%,0) scale(.4); opacity:0; }
                    15% { opacity:.65; }
                    100% { transform:translate(calc(-50% + var(--dx,8px)),-110px) scale(2.8); opacity:0; } }

  /* банки снюса, которые открываются */
  .sn { position:absolute; width:66px; height:66px; opacity:.9; transform:rotate(var(--r));
        animation:floaty var(--ft) ease-in-out infinite alternate; animation-delay:var(--fd); }
  .sn svg { width:100%; height:100%; overflow:visible; display:block; filter:drop-shadow(0 0 10px var(--c)); }
  .lid { transform-box:view-box; transform-origin:30px 22px; animation:openlid 6s ease-in-out infinite; animation-delay:var(--od); }
  .pouch.up { transform-box:fill-box; transform-origin:center; animation:popup 6s ease-in-out infinite; animation-delay:var(--od); }
  .spark { transform-box:fill-box; transform-origin:center; opacity:0; animation:spark 6s ease-in-out infinite; animation-delay:var(--od); }
  .spark.s2 { animation-delay:calc(var(--od) + .25s); }
  .spark.s3 { animation-delay:calc(var(--od) + .5s); }
  @keyframes openlid { 0%,12% { transform:translate(0,0) rotate(0); } 30%,62% { transform:translate(17px,-20px) rotate(34deg); } 80%,100% { transform:translate(0,0) rotate(0); } }
  @keyframes popup { 0%,25% { transform:translateY(0) rotate(0); } 40%,58% { transform:translateY(-10px) rotate(-10deg); } 72%,100% { transform:translateY(0) rotate(0); } }
  @keyframes spark { 0%,26% { opacity:0; transform:scale(.3); } 40%,56% { opacity:1; transform:scale(1); } 70%,100% { opacity:0; transform:scale(.3); } }

  /* дым и пар */
  .fog { position:absolute; width:70vw; height:45vh; left:var(--x); top:var(--y); border-radius:50%;
         background:radial-gradient(closest-side, var(--fc), transparent);
         animation:fogdrift var(--fdur) ease-in-out infinite alternate; animation-delay:var(--fdl); }
  @keyframes fogdrift { from { transform:translate(-8vw,2vh) scale(.9); } to { transform:translate(10vw,-4vh) scale(1.2); } }
  .wisp { position:absolute; bottom:-12vh; left:var(--x); width:var(--ww); height:46vh; border-radius:50%; opacity:0;
          background:radial-gradient(closest-side, rgba(255,255,255,.34), rgba(205,165,255,.16) 55%, transparent);
          animation:wisp var(--wd) ease-out infinite; animation-delay:var(--wdl); }
  @keyframes wisp { 0% { transform:translate(0,0) scale(.5,.6); opacity:0; }
                    20% { opacity:.55; }
                    100% { transform:translate(var(--wx),-70vh) scale(1.8,1.4); opacity:0; } }

  /* районы: где есть, где предзаказ, где нет в наличии */
  .areas { margin-top:3px; padding-top:6px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:3px; }
  .ar { font-size:12px; line-height:1.35; }
  .ar span { font-weight:700; }
  .ar.on span { color:var(--ok); }
  .ar.pre span { color:var(--warn); }
  .ar.no { opacity:.75; }
  .ar.no span { color:var(--muted); }
  @media (prefers-reduced-motion: reduce) { .scene { display:none; } }
  .wrap { position:relative; z-index:1; max-width:520px; margin:0 auto; }

  h1 { font-family:var(--display); font-weight:400; font-size:30px; margin:18px 4px 4px; letter-spacing:.5px;
       text-shadow:0 0 22px rgba(150,70,255,.8); }
  .sub { margin:0 4px 12px; font-size:13px; color:var(--muted); }

  .tabs { display:flex; flex-wrap:wrap; gap:8px; padding:6px 0 12px; }
  .tab { flex:none; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:20px;
         padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; transition:background .2s, border-color .2s; }
  .tab[aria-pressed="true"] { background:linear-gradient(135deg,var(--fire),#c4200a); border-color:var(--fire); color:#fff;
         box-shadow:0 4px 16px rgba(255,59,31,.45); }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0; }

  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  /* .cell не масштабируется, поэтому область наведения стабильна и анимация не дёргается */
  .cell { position:relative; }
  .card { border-radius:16px; background:linear-gradient(160deg,var(--surface2),var(--surface)); border:1px solid var(--line);
          display:flex; flex-direction:column; overflow:hidden; height:100%;
          transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
  .cell.off .card { filter:grayscale(.9); opacity:.55; }
  .pic { position:relative; overflow:hidden; aspect-ratio:1; }
  .pic svg { width:100%; height:100%; display:block; transition:transform .35s ease; }
  .pic::after { content:""; position:absolute; inset:0; transform:translateX(-120%);
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.26) 50%,transparent 70%); pointer-events:none; }

  @media (hover:hover) and (pointer:fine) {
    .cell:not(.off):hover { z-index:5; }
    .cell:not(.off):hover .card { transform:scale(1.07) translateY(-3px); border-color:var(--fire);
      box-shadow:0 14px 34px rgba(255,59,31,.45), 0 0 26px rgba(255,138,31,.3); }
    .cell:not(.off):hover .pic svg { transform:scale(1.12); }
    .cell:not(.off):hover .pic::after { transform:translateX(120%); transition:transform .6s ease; }
  }
  @media (hover:none) { .cell:not(.off) .card:active { transform:scale(.97); } }

  .info { padding:9px 10px 11px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .name { font-weight:700; font-size:14px; line-height:1.25; }
  .price { font-size:17px; font-weight:800; color:#fff; text-shadow:0 0 12px rgba(255,138,31,.6); }
  .badge { font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:20px; width:fit-content; border:1px solid currentColor; }
  .badge.in_stock { color:var(--ok); background:rgba(63,207,110,.12); }
  .badge.preorder { color:var(--warn); background:rgba(255,176,32,.12); }
  .badge.out { color:var(--off); background:rgba(255,255,255,.05); }
  .eta { font-size:12px; color:var(--muted); }
  .qty { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:7px; }
  .qty b { min-width:46px; text-align:center; font-size:15px; transition:transform .15s, color .15s; }
  .qty b.pop { transform:scale(1.25); color:var(--ember); }
  .qty button { width:38px; height:38px; border:0; border-radius:11px; font-size:20px; font-weight:700; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,var(--fire),#c4200a); box-shadow:0 4px 14px rgba(255,59,31,.4); transition:transform .12s; }
  .qty button:active:not(:disabled) { transform:scale(.88); }
  .qty button:disabled { opacity:.25; box-shadow:none; cursor:default; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }

  .bar { position:fixed; z-index:20; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,transparent,rgba(8,4,20,.92) 40%); display:none; }
  .bar.show { display:block; }
  .go { display:block; width:100%; max-width:496px; margin:0 auto; height:52px; border:0; border-radius:14px; cursor:pointer;
    font-size:16px; font-weight:800; color:#fff; background:linear-gradient(100deg,#ff3b1f,#ff8a1f,#ff3b1f); background-size:200% 100%;
    box-shadow:0 8px 30px rgba(255,59,31,.55); }
  .bar.show .go { animation:flow 3s linear infinite; }
  @keyframes flow { to { background-position:-200% 0; } }

  .overlay { position:fixed; z-index:30; inset:0; background:rgba(0,0,0,.65); display:none; align-items:flex-end; justify-content:center; }
  .overlay.show { display:flex; }
  .sheet { width:100%; max-width:520px; background:linear-gradient(180deg,#2a1210,#140808); border-top:1px solid var(--fire);
    border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:82%; overflow-y:auto;
    box-shadow:0 -10px 50px rgba(255,59,31,.35); }
  .sheet h3 { font-family:var(--display); font-weight:400; font-size:22px; margin:0 0 6px; }
  .sheet p { font-size:13.5px; color:var(--muted); line-height:1.5; margin:10px 0 14px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:8px 0; font-size:14px; border-bottom:1px solid var(--line); }
  .row.total { border:0; font-weight:800; font-size:17px; padding-top:12px; }
  .close { display:block; margin:8px auto 0; background:none; border:0; color:var(--ember); font-size:15px; cursor:pointer; padding:8px; }
  @media (prefers-reduced-motion: no-preference) { .sheet { animation:up .25s ease-out; } @keyframes up { from { transform:translateY(50px); opacity:0; } } }
  @media (prefers-reduced-motion: reduce) { .card, .pic svg { transition:none; } .bar.show .go { animation:none; } #embers { display:none; } }
</style>

</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="scene" id="scene" aria-hidden="true"></div>
<div class="wrap">
  <h1>dirtyshopp27</h1>
  <p class="sub">Цена, время и место встречи — через админа</p>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="bar" id="bar"><button class="go" id="checkout" type="button"></button></div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
var inTG = !!(tg && tg.initData);
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#080414"); tg.setBackgroundColor("#080414"); } catch (e) {}
}

var LABELS = { in_stock:"В наличии", preorder:"Предзаказ", out:"Нет в наличии" };
var CATS = [
  { id:"all", name:"Все" }, { id:"liquid", name:"Жижки" }, { id:"vape", name:"Вейпы" },
  { id:"snus", name:"Снюсы" }, { id:"disp", name:"Одноразки" }, { id:"energy", name:"Энергетики" }
];
var COLORS = { liquid:"#b52ee6", vape:"#2ec4b6", snus:"#ff8a1f", disp:"#4a7fc0", energy:"#3fcf6e" };
var products = [], cart = {}, current = "all";

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function placeholder(color, i) {
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs>' +
    '<radialGradient id="g' + i + '" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="' + color + '" stop-opacity=".95"/><stop offset="1" stop-color="#120708"/></radialGradient></defs>' +
    '<rect width="100" height="100" fill="url(#g' + i + ')"/>' +
    '<circle cx="50" cy="50" r="27" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="4"/>' +
    '<circle cx="50" cy="50" r="17" fill="rgba(255,255,255,.14)"/><circle cx="50" cy="50" r="5" fill="#fff"/></svg>';
}

var AREAS = [ { id:"ilinka", name:"Ильинка" }, { id:"nekrasovka", name:"Некрасовка" }, { id:"yuzhny", name:"Южный" }, { id:"krechka", name:"Красная речка" } ];
function normProduct(p) {
  var st = {};
  AREAS.forEach(function (a) {
    var v;
    if (p.areas && !Array.isArray(p.areas)) v = p.areas[a.id] || "out";
    else if (Array.isArray(p.areas)) v = (p.status !== "out" && p.areas.indexOf(a.id) !== -1) ? (p.status === "preorder" ? "preorder" : "in_stock") : "out";
    else v = p.status || "in_stock";
    st[a.id] = v;
  });
  p._st = st;
  var vals = AREAS.map(function (a) { return st[a.id]; });
  p.status = vals.indexOf("in_stock") !== -1 ? "in_stock" : (vals.indexOf("preorder") !== -1 ? "preorder" : "out");
  return p;
}
function areasHTML(p) {
  var groups = [ ["in_stock", "Есть в", "Есть во всех районах", "on"], ["preorder", "Предзаказ в", "Предзаказ во всех районах", "pre"], ["out", "Нет в наличии", "Нет в наличии во всех районах", "no"] ];
  return '<div class="areas">' + groups.map(function (g) {
    var names = AREAS.filter(function (a) { return p._st[a.id] === g[0]; }).map(function (a) { return a.name; });
    if (!names.length) return "";
    var text = names.length === AREAS.length ? '<span>' + g[2] + '</span>' : '<span>' + g[1] + ':</span> ' + names.join(", ");
    return '<div class="ar ' + g[3] + '">' + text + '</div>';
  }).join("") + '</div>';
}

function drawTabs() {
  var t = document.getElementById("tabs");
  t.innerHTML = "";
  CATS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.textContent = c.name; b.dataset.cat = c.id;
    b.setAttribute("aria-pressed", c.id === current ? "true" : "false");
    t.appendChild(b);
  });
}

/* сетка перерисовывается только при смене раздела, не при нажатии + / − */
function drawGrid() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  var list = products.filter(function (p) { return current === "all" || p.cat === current; });
  if (!list.length) { grid.innerHTML = '<div class="empty">В этом разделе пока пусто</div>'; return; }
  list.forEach(function (p) {
    var i = products.indexOf(p), off = p.status === "out", q = cart[p.id] || 0;
    var color = p.color || COLORS[p.cat] || "#ff3b1f";
    var el = document.createElement("div");
    el.className = "cell" + (off ? " off" : "");
    el.dataset.id = p.id;
    el.innerHTML = '<div class="card"><div class="pic">' +
      (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease">' : placeholder(color, i)) +
      '</div><div class="info"><div class="name">' + esc(p.name) + '</div>' +
      '<div class="price">' + esc(p.price) + ' €</div>' +
      '<div class="badge ' + esc(p.status) + '">' + (LABELS[p.status] || "") + '</div>' +
      (p.eta && Object.keys(p._st).some(function (k) { return p._st[k] === "preorder"; }) ? '<div class="eta">' + esc(p.eta) + '</div>' : '') +
      areasHTML(p) +
      '<div class="qty"><button type="button" aria-label="Убрать" class="minus" data-d="-1"' + (off || !q ? " disabled" : "") + '>−</button>' +
      '<b>' + q + ' шт</b>' +
      '<button type="button" aria-label="Добавить" data-d="1"' + (off ? " disabled" : "") + '>+</button></div></div></div>';
    var img = el.querySelector("img");
    if (img) img.addEventListener("error", function () { img.parentNode.innerHTML = placeholder(color, i); });
    grid.appendChild(el);
  });
}

function totals() {
  var t = 0, n = 0;
  products.forEach(function (p) { var q = cart[p.id] || 0; t += q * p.price; n += q; });
  return { t:t, n:n };
}

function updateBar() {
  var s = totals(), text = "Оформить (" + s.n + " шт, " + s.t + " €)";
  if (inTG) {
    if (s.n > 0) { tg.MainButton.setParams({ text:text, color:"#ff3b1f", text_color:"#ffffff" }); tg.MainButton.show(); }
    else tg.MainButton.hide();
  } else {
    document.getElementById("bar").classList.toggle("show", s.n > 0);
    document.getElementById("checkout").textContent = text;
  }
}

function sendOrder() {
  var items = Object.keys(cart).map(function (id) { return { id:id, qty:cart[id] }; });
  if (!items.length) return;
  if (inTG) tg.sendData(JSON.stringify({ items:items }));
  else alert("Откройте магазин через бота, чтобы отправить заказ.");
}
if (inTG) tg.MainButton.onClick(sendOrder);
document.getElementById("checkout").addEventListener("click", sendOrder);

document.getElementById("tabs").addEventListener("click", function (e) {
  var b = e.target.closest(".tab");
  if (!b) return;
  current = b.dataset.cat;
  Array.prototype.forEach.call(this.children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  drawGrid();
});

document.getElementById("grid").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-d]");
  if (!b) return;
  var cell = b.closest(".cell"), id = cell.dataset.id, d = parseInt(b.dataset.d, 10);
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  var q = cart[id] || 0, num = cell.querySelector("b");
  num.textContent = q + " шт";
  cell.querySelector(".minus").disabled = !q;
  num.classList.add("pop");
  setTimeout(function () { num.classList.remove("pop"); }, 150);
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e2) {} }
  updateBar();
});

/* искры, летящие вверх; на скрытой вкладке анимация встаёт на паузу */
(function () {
  var cv = document.getElementById("embers"), cx = cv.getContext("2d"), W, H, parts = [], run = true;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size(); addEventListener("resize", size);
  document.addEventListener("visibilitychange", function () { run = !document.hidden; if (run) loop(); });
  function mk(init) {
    return { x:Math.random() * W, y:init ? Math.random() * H : H + 10, r:Math.random() * 1.8 + .6,
             vy:Math.random() * .7 + .25, dx:(Math.random() - .5) * .4, ph:Math.random() * 6.28,
             c:Math.random() < .7 ? "190,130,255" : "255,150,230" };
  }
  for (var i = 0; i < 30; i++) parts.push(mk(true));
  function loop() {
    if (!run) return;
    cx.clearRect(0, 0, W, H);
    parts.forEach(function (p, i) {
      p.y -= p.vy; p.ph += .03; p.x += p.dx + Math.sin(p.ph) * .35;
      var a = Math.max(0, Math.min(1, p.y / H)) * .85;
