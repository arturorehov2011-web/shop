<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
  :root {

          transition:transform .22s ease, border-color .22s ease, box-shadow .22s ease; }
  .cell.off .card { opacity:.62; filter:grayscale(.6); }
  .pic { position:relative; aspect-ratio:1; overflow:hidden; background:#0d0a18; }
  .pic svg, .pic img { width:100%; height:100%; display:block; object-fit:cover; transition:transform .4s ease; }
  .chip { position:absolute; left:8px; top:8px; display:flex; align-items:center; gap:6px; padding:4px 9px 4px 8px;
          border-radius:20px; font-size:11px; font-weight:600; color:#fff; background:rgba(10,8,18,.66);
          backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.1); }
  .chip i { width:6px; height:6px; border-radius:50%; background:var(--off); }
  .chip.in_stock i { background:var(--ok); } .chip.preorder i { background:var(--warn); }

  @media (hover:hover) and (pointer:fine) {
    .cell:not(.off):hover { z-index:5; }
    .cell:not(.off):hover .card { transform:translateY(-3px) scale(1.03); border-color:rgba(139,92,246,.6);
      box-shadow:0 18px 44px rgba(0,0,0,.55), 0 0 0 1px rgba(139,92,246,.25); }
    .cell:not(.off):hover .pic svg, .cell:not(.off):hover .pic img { transform:scale(1.06); }
  }
  @media (hover:none) { .cell:not(.off) .card:active { transform:scale(.98); } }

  .info { display:flex; flex-direction:column; gap:6px; padding:12px; flex:1; }
  .price { font-size:19px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }

  .ar::before { content:""; position:absolute; left:0; top:.5em; width:6px; height:6px; border-radius:50%; background:var(--off); }
  .ar.on::before { background:var(--ok); } .ar.pre::before { background:var(--warn); }
  .ar span { color:var(--muted); }
  .ar.no { color:var(--muted); }

  .act { margin-top:auto; padding-top:10px; }
  .btn { width:100%; height:40px; border:0; border-radius:12px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:600;
         color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-d)); transition:filter .15s, transform .1s; }
  .btn:hover { filter:brightness(1.1); } .btn:active { transform:scale(.97); }
  .btn:disabled { background:rgba(255,255,255,.06); color:var(--muted); cursor:default; filter:none; transform:none; }
  .step { display:flex; align-items:center; height:40px; border-radius:12px; background:rgba(139,92,246,.16); border:1px solid rgba(139,92,246,.45); }
  .step button { width:42px; height:100%; border:0; background:none; color:#fff; font-size:20px; font-family:inherit; cursor:pointer; border-radius:12px; }
  .step button:active { background:rgba(255,255,255,.1); }
  .step span { flex:1; text-align:center; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  button:focus-visible { outline:2px solid #fff; outline-offset:2px; }

  .bar { position:fixed; z-index:20; left:0; right:0; bottom:0; display:none; padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
         background:linear-gradient(180deg,transparent,rgba(8,6,15,.94) 38%); }
  .bar.show { display:block; }
  .barin { max-width:492px; margin:0 auto; display:flex; align-items:center; gap:14px; padding:10px 10px 10px 16px; border-radius:18px;
           background:rgba(26,21,44,.92); border:1px solid rgba(139,92,246,.4); box-shadow:0 12px 36px rgba(0,0,0,.5);
           backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .sum { display:flex; flex-direction:column; line-height:1.2; }
  .sum small { font-size:12px; color:var(--muted); }
  .sum b { font-size:18px; font-weight:800; letter-spacing:-.02em; }
  .barin .btn { width:auto; flex:1; height:46px; font-size:15px; }

  .overlay { position:fixed; z-index:40; inset:0; display:none; align-items:flex-end; justify-content:center;
             background:rgba(0,0,0,.62); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .overlay.show { display:flex; }
  .sheet { width:100%; max-width:520px; max-height:90%; overflow-y:auto; padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));
           border-radius:22px 22px 0 0; border-top:1px solid rgba(139,92,246,.55);
           background:linear-gradient(180deg,#1b1533,#100c20); box-shadow:0 -14px 50px rgba(0,0,0,.6); }
  .sheet h2 { margin:0 0 6px; font-size:19px; font-weight:800; letter-spacing:-.02em; }
  .sheet .hint { margin:0 0 14px; font-size:13px; line-height:1.45; color:var(--muted); }
  .opt { width:100%; display:flex; align-items:center; gap:12px; margin-bottom:8px; padding:12px 14px; text-align:left; cursor:pointer;
         border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--text); font-family:inherit;
         transition:border-color .15s, background .15s; }
  .opt .radio { flex:none; width:18px; height:18px; border-radius:50%; border:2px solid var(--muted); }
  .opt.sel { border-color:var(--accent); background:rgba(139,92,246,.16); }
  .opt.sel .radio { border-color:var(--accent); background:radial-gradient(circle, var(--accent) 45%, transparent 50%); }
  .opt:disabled { opacity:.45; cursor:default; }
  .opt b { display:block; font-size:15px; font-weight:700; }
  .opt small { display:block; margin-top:2px; font-size:12px; line-height:1.35; color:var(--muted); }
  .note { margin:4px 0 12px; padding:10px 12px; border-radius:12px; font-size:13px; line-height:1.45;
          background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.35); }
  .note.warn { background:rgba(248,113,113,.1); border-color:rgba(248,113,113,.4); }
  .link { display:block; margin:10px auto 0; padding:8px; border:0; background:none; color:var(--muted); font-family:inherit; font-size:14px; cursor:pointer; }

  /* фон: чёрные силуэты зомби, вейпов и банок снюса */
  .scene { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .sil svg { display:block; width:100%; height:auto; overflow:visible;
             filter:drop-shadow(0 0 1px rgba(210,175,255,.95)) drop-shadow(0 0 9px rgba(139,92,246,.6)); }
  .zw { position:absolute; left:0; bottom:var(--b); width:var(--w); opacity:var(--o);
        animation:patrol var(--t) linear infinite; animation-delay:var(--d); }
  .zf { animation:turn var(--t) linear infinite; animation-delay:var(--d); }
  @keyframes patrol { 0%,100% { transform:translateX(0); } 50% { transform:translateX(calc(100vw - var(--w))); } }
  @keyframes turn { 0%,49.99% { transform:scaleX(1); } 50%,99.99% { transform:scaleX(-1); } }
  .zb { animation:bob .4s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-3px); } }
  .leg, .arm { transform-box:fill-box; }
  .leg { transform-origin:50% 0; animation:swing .8s ease-in-out infinite alternate; }
  .leg.b { animation-direction:alternate-reverse; }
  .arm { transform-origin:0 50%; animation:reach 1s ease-in-out infinite alternate; }
  .arm.a2 { animation-direction:alternate-reverse; }
  @keyframes swing { from { transform:rotate(-22deg); } to { transform:rotate(22deg); } }
  @keyframes reach { from { transform:rotate(-5deg); } to { transform:rotate(6deg); } }
  .eye { animation:blink 2.4s ease-in-out infinite; }
  .vp, .sn { position:absolute; width:var(--w); opacity:var(--o); transform:rotate(var(--r));
             animation:floaty var(--ft) ease-in-out infinite alternate; animation-delay:var(--fd); }
  @keyframes floaty { from { transform:translateY(-12px) rotate(calc(var(--r) - 5deg)); } to { transform:translateY(14px) rotate(calc(var(--r) + 5deg)); } }
  .led { animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .puff { position:absolute; left:50%; top:0; width:30px; height:30px; border-radius:50%; opacity:0;
          background:radial-gradient(circle, rgba(196,160,255,.9) 0%, rgba(255,255,255,.25) 40%, transparent 70%);
          animation:rise 4.2s ease-out infinite; }
  .puff:nth-of-type(2) { animation-delay:1.4s; --dx:-16px; }
  .puff:nth-of-type(3) { animation-delay:2.8s; --dx:22px; }
  @keyframes rise { 0% { transform:translate(-50%,0) scale(.4); opacity:0; } 15% { opacity:.7; }
                    100% { transform:translate(calc(-50% + var(--dx,8px)),-110px) scale(2.8); opacity:0; } }
  .lid { transform-box:view-box; transform-origin:30px 22px; animation:openlid 6s ease-in-out infinite; animation-delay:var(--od); }
  .pouch.up { transform-box:fill-box; transform-origin:center; animation:popup 6s ease-in-out infinite; animation-delay:var(--od); }
  .spark { transform-box:fill-box; transform-origin:center; opacity:0; animation:spark 6s ease-in-out infinite; animation-delay:var(--od); }
  .spark.s2 { animation-delay:calc(var(--od) + .3s); }
  @keyframes openlid { 0%,12% { transform:translate(0,0) rotate(0); } 30%,62% { transform:translate(17px,-20px) rotate(34deg); } 80%,100% { transform:translate(0,0) rotate(0); } }
  @keyframes popup { 0%,25% { transform:translateY(0) rotate(0); } 40%,58% { transform:translateY(-10px) rotate(-10deg); } 72%,100% { transform:translateY(0) rotate(0); } }
  @keyframes spark { 0%,26% { opacity:0; transform:scale(.3); } 40%,56% { opacity:1; transform:scale(1); } 70%,100% { opacity:0; transform:scale(.3); } }
/* дым и пар */
  .fog { position:absolute; width:70vw; height:45vh; left:var(--x); top:var(--y); border-radius:50%;
         background:radial-gradient(closest-side, var(--fc), transparent);
         animation:fogdrift var(--fdur) ease-in-out infinite alternate; animation-delay:var(--fdl); }
  @keyframes fogdrift { from { transform:translate(-8vw,2vh) scale(.9); } to { transform:translate(10vw,-4vh) scale(1.2); } }
  .wisp { position:absolute; bottom:-12vh; left:var(--x); width:var(--ww); height:46vh; border-radius:50%; opacity:0;
          background:radial-gradient(closest-side, rgba(255,255,255,.34), rgba(205,165,255,.16) 55%, transparent);
          animation:wisp var(--wd) ease-out infinite; animation-delay:var(--wdl); }
  @keyframes wisp { 0% { transform:translate(0,0) scale(.5,.6); opacity:0; }
                    20% { opacity:.55; }
                    100% { transform:translate(var(--wx),-70vh) scale(1.8,1.4); opacity:0; } }

  
  @media (prefers-reduced-motion: reduce) { .scene { display:none; } .card, .pic svg, .pic img { transition:none; } }
</style>

<body>
<div class="scene" id="scene" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1 class="logo">dirtyshopp<span>27</span></h1>
    <p class="sub">Выберите товары. Цену, время и место встречи согласуете с админом.</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>
<div class="bar" id="bar">
  <div class="barin">
    <div class="sum"><small id="cnt"></small><b id="tot"></b></div>
    <button class="btn" id="checkout" type="button">Оформить заказ</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Выбор района">
    <h2>Выберите район</h2>
    <p class="hint">Заказ оформляется на один район. Недоступны районы, где нет части выбранных товаров.</p>
    <div id="opts"></div>
    <div id="note"></div>
    <button class="btn" id="confirm" type="button" disabled>Отправить заказ</button>
    <button class="link" id="cancel" type="button">Вернуться к выбору</button>
  </div>
</div>

<script>
var tg = window.Telegram && window.Telegram.WebApp;
var inTG = !!(tg && tg.initData);
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0d0a18"); tg.setBackgroundColor("#08060f"); } catch (e) {}
}

var LABELS = { in_stock:"В наличии", preorder:"Предзаказ", out:"Нет в наличии" };
var CATS = [
  { id:"all", name:"Все" }, { id:"liquid", name:"Жижки" }, { id:"vape", name:"Вейпы" },
  { id:"snus", name:"Снюсы" }, { id:"disp", name:"Одноразки" }, { id:"energy", name:"Энергетики" }
];
var COLORS = { liquid:"#8b5cf6", vape:"#3b82f6", snus:"#f59e0b", disp:"#ec4899", energy:"#10b981" };
var AREAS = [ { id:"ilinka", name:"Ильинка" }, { id:"nekrasovka", name:"Некрасовка" }, { id:"yuzhny", name:"Южный" }, { id:"krechka", name:"Красная речка" } ];
var products = [], cart = {}, current = "all", sheetOpen = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

function normProduct(p) {
  var st = {};
  AREAS.forEach(function (a) {
    var v;
    if (p.areas && !Array.isArray(p.areas)) v = p.areas[a.id] || "out";
    else if (Array.isArray(p.areas)) v = (p.status !== "out" && p.areas.indexOf(a.id) !== -1) ? (p.status === "preorder" ? "preorder" : "in_stock") : "out";
    else v = p.status || "in_stock";
    st[a.id] = v;
  });
  p._st = st;
  var vals = AREAS.map(function (a) { return st[a.id]; });
  p.status = vals.indexOf("in_stock") !== -1 ? "in_stock" : (vals.indexOf("preorder") !== -1 ? "preorder" : "out");
  return p;
}

function areasHTML(p) {
  var groups = [ ["in_stock", "Есть в", "Есть во всех районах", "on"], ["preorder", "Предзаказ в", "Предзаказ во всех районах", "pre"], ["out", "Нет в", "Нет ни в одном районе", "no"] ];
  return '<div class="areas">' + groups.map(function (g) {
    var names = AREAS.filter(function (a) { return p._st[a.id] === g[0]; }).map(function (a) { return a.name; });
    if (!names.length) return "";
    var text = names.length === AREAS.length ? g[2] : '<span>' + g[1] + '</span> ' + names.join(", ");
    return '<div class="ar ' + g[3] + '">' + text + '</div>';
  }).join("") + '</div>';
}

function placeholder(color, i) {
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs>' +
    '<linearGradient id="g' + i + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + color + '" stop-opacity=".55"/><stop offset="1" stop-color="#0d0a18"/></linearGradient></defs>' +
    '<rect width="100" height="100" fill="url(#g' + i + ')"/>' +
    '<circle cx="50" cy="50" r="22" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.5"/>' +
    '<circle cx="50" cy="50" r="4" fill="rgba(255,255,255,.55)"/></svg>';
}

function actHTML(p, q) {
  if (p.status === "out") return '<button class="btn" type="button" disabled>Нет в наличии</button>';
  if (!q) return '<button class="btn" type="button" data-d="1">' + (p.status === "preorder" ? "Предзаказ" : "В корзину") + '</button>';
  return '<div class="step"><button type="button" data-d="-1" aria-label="Убрать">−</button><span>' + q + ' шт</span><button type="button" data-d="1" aria-label="Добавить">+</button></div>';
}

function drawTabs() {
  var t = document.getElementById("tabs");
  t.innerHTML = "";
  CATS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.textContent = c.name; b.dataset.cat = c.id;
    b.setAttribute("aria-pressed", c.id === current ? "true" : "false");
    t.appendChild(b);
  });
}

/* сетка перерисовывается только при смене раздела; кнопки в карточке обновляются на месте */
function drawGrid() {
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  var list = products.filter(function (p) { return current === "all" || p.cat === current; });
  if (!list.length) { grid.innerHTML = '<div class="empty">В этом разделе пока пусто</div>'; return; }
  list.forEach(function (p) {
    var i = products.indexOf(p), off = p.status === "out", q = cart[p.id] || 0;
    var color = p.color || COLORS[p.cat] || "#8b5cf6";
    var hasEta = p.eta && Object.keys(p._st).some(function (k) { return p._st[k] === "preorder"; });
    var el = document.createElement("div");
    el.className = "cell" + (off ? " off" : "");
    el.dataset.id = p.id;
    el.innerHTML = '<article class="card"><div class="pic">' +
      (p.image ? '<img src="' + esc(p.image) + '" alt="" loading="lazy">' : placeholder(color, i)) +
      '<span class="chip ' + esc(p.status) + '"><i></i>' + (LABELS[p.status] || "") + '</span></div>' +
      '<div class="info"><div class="price">' + esc(p.price) + ' ₽</div>' +
      '<h3 class="name">' + esc(p.name) + '</h3>' +
      (hasEta ? '<div class="eta">' + esc(p.eta) + '</div>' : '') +
      areasHTML(p) +
      '<div class="act">' + actHTML(p, q) + '</div></div></article>';
    var img = el.querySelector("img");
    if (img) img.addEventListener("error", function () { img.outerHTML = placeholder(color, i); });
    grid.appendChild(el);
  });
}

function totals() {
  var t = 0, n = 0;
  products.forEach(function (p) { var q = cart[p.id] || 0; t += q * p.price; n += q; });
  return { t:t, n:n };
}

function updateBar() {
  var s = totals();
  if (inTG) {
    if (s.n > 0 && !sheetOpen) { tg.MainButton.setParams({ text:"Оформить заказ · " + s.n + " шт · " + s.t + " ₽", color:"#7c4dff", text_color:"#ffffff" }); tg.MainButton.show(); }
    else tg.MainButton.hide();
  } else {
    document.getElementById("bar").classList.toggle("show", s.n > 0);
    document.getElementById("cnt").textContent = "В корзине: " + s.n + " шт";
    document.getElementById("tot").textContent = s.t + " ₽";
  }
}

var PREORDER_CONTACTS = "@dahqwll1dirt и @ugadair";
var area = null;

function cartList() { return products.filter(function (p) { return cart[p.id]; }); }
function areaInfo(id) {
  var out = [], pre = [];
  cartList().forEach(function (p) {
    var s = p._st[id];
    if (s === "out") out.push(p.name); else if (s === "preorder") pre.push(p.name);
  });
  return { out:out, pre:pre };
}

function renderSheet() {
  var okCount = 0;
  var opts = AREAS.map(function (a) {
    var i = areaInfo(a.id), bad = i.out.length > 0;
    if (!bad) okCount++;
    var sub = bad ? "Нет: " + i.out.join(", ") : (i.pre.length ? "Предзаказ: " + i.pre.join(", ") : "Всё есть в наличии");
    return '<button type="button" class="opt' + (area === a.id ? " sel" : "") + '" data-area="' + a.id + '"' + (bad ? " disabled" : "") + '>' +
      '<span class="radio"></span><span><b>' + esc(a.name) + '</b><small>' + esc(sub) + '</small></span></button>';
  }).join("");
  var note = "";
  if (!okCount) note = '<div class="note warn">Ни в одном районе нет всех выбранных товаров. Уберите часть товаров из корзины.</div>';
  else if (area && areaInfo(area).pre.length) note = '<div class="note">В заказе есть предзаказ. По поводу предзаказа пишите ' + PREORDER_CONTACTS + '.</div>';
  document.getElementById("opts").innerHTML = opts;
  document.getElementById("note").innerHTML = note;
  document.getElementById("confirm").disabled = !area;
}

function openSheet() {
  if (!totals().n) return;
  area = null; sheetOpen = true;
  if (inTG) tg.MainButton.hide();
  renderSheet();
  document.getElementById("overlay").classList.add("show");
}
function closeSheet() {
  sheetOpen = false;
  document.getElementById("overlay").classList.remove("show");
  updateBar();
}
function confirmOrder() {
  if (!area) return;
  var items = Object.keys(cart).map(function (id) { return { id:id, qty:cart[id] }; });
  if (!items.length) return;
  if (inTG) tg.sendData(JSON.stringify({ items:items, area:area }));
  else { alert("Откройте магазин через бота, чтобы отправить заказ."); closeSheet(); }
}
if (inTG) tg.MainButton.onClick(openSheet);
document.getElementById("checkout").addEventListener("click", openSheet);
document.getElementById("opts").addEventListener("click", function (e) {
  var b = e.target.closest(".opt");
  if (!b || b.disabled) return;
  area = b.dataset.area;
  renderSheet();
});
document.getElementById("confirm").addEventListener("click", confirmOrder);
document.getElementById("cancel").addEventListener("click", closeSheet);
document.getElementById("overlay").addEventListener("click", function (e) { if (e.target === this) closeSheet(); });

document.getElementById("tabs").addEventListener("click", function (e) {
  var b = e.target.closest(".tab");
  if (!b) return;
  current = b.dataset.cat;
  Array.prototype.forEach.call(this.children, function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
  drawGrid();
});

document.getElementById("grid").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-d]");
  if (!b) return;
  var cell = b.closest(".cell"), id = cell.dataset.id, d = parseInt(b.dataset.d, 10);
  var p = products.filter(function (x) { return x.id === id; })[0];
  if (!p || p.status === "out") return;
  cart[id] = Math.max(0, (cart[id] || 0) + d);
  if (!cart[id]) delete cart[id];
  cell.querySelector(".act").innerHTML = actHTML(p, cart[id] || 0);
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e2) {} }
  updateBar();
});
